name: Publish book

on:
  push:
    branches: [main]
    paths: ['report/**', 'spectra/**', 'steady/output/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: report/core

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build WASM module
        run: wasm-pack build core --target web --release --out-dir ../app/pkg

      - name: Build Rust API documentation (linked from the text)
        run: |
          cargo doc --no-deps --release --manifest-path core/Cargo.toml
          rm -rf api && cp -r core/target/doc api

      - name: Check provenance links
        run: python3 scripts/check_links.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Render site
        run: quarto render

      # the second book (spectra/) is published below the first, whose laboratory code and data its widgets use
      - name: Render the second book into spectra/
        run: |
          (cd ../spectra && quarto render)
          rm -rf _site/spectra && cp -r ../spectra/_site _site/spectra

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
